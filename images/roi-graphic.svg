<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Outsourced Bar Gradient (Negative/Neutral) -->
    <linearGradient id="outGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- In-house Bar Gradient (Positive/Brand) -->
    <linearGradient id="inGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glow Effect for In-house -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Cards -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="800" height="400" rx="20" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Grid Pattern for Dashboard Feel -->
  <g stroke="#f1f5f9" stroke-width="1.5">
    <line x1="80" y1="100" x2="720" y2="100" />
    <line x1="80" y1="180" x2="720" y2="180" />
    <line x1="80" y1="260" x2="720" y2="260" />
  </g>

  <!-- ===============================
       Left Card: Outsourced
       =============================== -->
  <rect x="80" y="60" width="280" height="280" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Title -->
  <text x="110" y="105" fill="#64748b" font-family="Inter, sans-serif" font-size="16" font-weight="700">外部ベンダーへの依頼</text>
  
  <!-- Big Red/Gray Costs -->
  <text x="110" y="150" fill="#475569" font-family="Inter, sans-serif" font-size="36" font-weight="800">30~100<tspan font-size="16" font-weight="600" fill="#94a3b8">万円</tspan></text>
  <text x="110" y="180" fill="#64748b" font-family="Inter, sans-serif" font-size="14" font-weight="500">納期: 約1ヶ月〜</text>

  <!-- Visual Representation (Tall Bar) -->
  <rect x="250" y="120" width="70" height="180" rx="8" fill="url(#outGrad)"/>
  <rect x="250" y="120" width="70" height="15" rx="4" fill="#ffffff" fill-opacity="0.2"/>

  <!-- ===============================
       Center: Arrow 
       =============================== -->
  <g transform="translate(385, 175)">
    <circle cx="15" cy="15" r="25" fill="#f8fafc" filter="url(#shadow)"/>
    <path d="M5 15L25 15M25 15L17 7M25 15L17 23" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===============================
       Right Card: Antigravity In-house
       =============================== -->
  <!-- Highlight Backdrop -->
  <rect x="440" y="40" width="300" height="320" rx="20" fill="#eff6ff" opacity="0.5"/>
  <rect x="450" y="50" width="280" height="300" rx="16" fill="#ffffff" filter="url(#shadow)" stroke="#bfdbfe" stroke-width="2"/>
  
  <!-- Title & Badge -->
  <rect x="480" y="70" width="60" height="24" rx="12" fill="#dbeafe"/>
  <text x="494" y="87" fill="#1d4ed8" font-family="Inter, sans-serif" font-size="12" font-weight="700">AI活用</text>
  <text x="550" y="88" fill="#1e293b" font-family="Inter, sans-serif" font-size="16" font-weight="700">自社で内製化</text>

  <!-- Massive Cost Reduction -->
  <text x="480" y="145" fill="#1d4ed8" font-family="Inter, sans-serif" font-size="48" font-weight="800">0<tspan font-size="20" font-weight="600" fill="#3b82f6">円</tspan></text>
  <text x="480" y="175" fill="#3b82f6" font-family="Inter, sans-serif" font-size="15" font-weight="700">納期: 最短2日間</text>

  <!-- Visual Representation (Tiny Bar showing massive saving + Glow) -->
  <rect x="630" y="270" width="70" height="40" rx="8" fill="url(#inGrad)" filter="url(#glow)"/>
  <rect x="630" y="270" width="70" height="15" rx="4" fill="#ffffff" fill-opacity="0.3"/>

  <!-- AI Sparkles / Icon -->
  <path d="M665 240L667 250L677 252L667 254L665 264L663 254L653 252L663 250Z" fill="#60a5fa"/>
  <path d="M640 230L641 235L646 236L641 237L640 242L639 237L634 236L639 235Z" fill="#93c5fd"/>

  <!-- Bottom Message -->
  <rect x="480" y="270" width="130" height="40" rx="20" fill="#f1f5f9"/>
  <text x="545" y="295" fill="#64748b" font-family="Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">工数 80% 削減</text>

</svg>
